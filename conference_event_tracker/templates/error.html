{% extends 'base.html' %}

{% block title %}{{ error_title }} - CosmicEvents{% endblock %}

{% block content %}
<div class="error-wrapper">
    <div class="error-glass-card">
        <div class="error-portal">✦</div>
        <h1 class="error-code-title">{{ error_title }}</h1>
        <p class="error-desc-text">{{ error_message }}</p>
        <a href="{{ url_for('index') }}" class="btn-glowing outline">
            <span>← Return to Safety</span>
        </a>
    </div>
</div>
{% endblock %}
